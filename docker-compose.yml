version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: velocityllm-postgres
    environment:
      POSTGRES_USER: velocityllm
      POSTGRES_PASSWORD: velocityllm_password
      POSTGRES_DB: velocityllm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velocityllm"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: velocityllm-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Python Inference Worker
  worker:
    build:
      context: ./python_worker
      dockerfile: Dockerfile
    container_name: velocityllm-worker
    environment:
      - GRPC_HOST=0.0.0.0
      - GRPC_PORT=50051
      - WORKER_ID=worker-docker-1
    ports:
      - "50051:50051"
    restart: unless-stopped

  # Backend API Server
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: velocityllm-backend
    environment:
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: velocityllm
      DB_PASSWORD: velocityllm_password
      DB_NAME: velocityllm

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # Python Worker (gRPC)
      WORKER_HOST: worker
      WORKER_PORT: 50051

      # Server
      SERVER_PORT: 8080

      # JWT Secret (change this in production!)
      JWT_SECRET: your-secret-key-change-this-in-production

      # LLM Provider API Keys (add your keys here)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

      # OAuth2 (optional)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      OAUTH_REDIRECT_BASE_URL: http://localhost:8080/api/v1
      FRONTEND_URL: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      worker:
        condition: service_started
    restart: unless-stopped

  # Frontend Next.js App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: velocityllm-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
