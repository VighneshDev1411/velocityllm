# =============================================================================
# VelocityLLM — HAProxy Load Balancer Configuration (Day 33)
# =============================================================================
# Handles: SSL termination, weighted routing, sticky sessions, health checks,
#          connection limiting, and request routing algorithms.
#
# Usage:
#   haproxy -f haproxy.cfg
#   docker run -v $(pwd)/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg haproxy:alpine
# =============================================================================

global
    log stdout format raw local0 info
    maxconn 50000
    nbthread 4                        # match CPU cores
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    tune.ssl.default-dh-param 2048
    stats socket /var/run/haproxy.sock mode 660 level admin expose-fd listeners

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  http-server-close         # close backend connection after each request
    option  forwardfor                # add X-Forwarded-For header
    option  redispatch                # retry on different backend if one fails
    retries 3
    timeout connect  5s
    timeout client   60s
    timeout server   120s             # longer for LLM completions
    timeout http-request 30s
    timeout http-keep-alive 15s
    timeout queue    10s
    timeout tunnel   3600s            # for WebSocket / SSE connections
    maxconn 10000
    errorfile 400 /etc/haproxy/errors/400.http
    errorfile 503 /etc/haproxy/errors/503.http

# =============================================================================
# STATS dashboard
# =============================================================================
frontend stats_frontend
    bind *:8404
    stats enable
    stats uri /haproxy-stats
    stats realm "VelocityLLM HAProxy Stats"
    stats auth admin:changeme          # ← change password
    stats refresh 10s
    stats show-node
    stats show-legends
    stats hide-version

# =============================================================================
# HTTP → HTTPS redirect
# =============================================================================
frontend http_redirect
    bind *:80
    http-request redirect scheme https code 301

# =============================================================================
# HTTPS frontend — SSL termination
# =============================================================================
frontend https_frontend
    bind *:443 ssl crt /etc/haproxy/ssl/velocityllm.pem alpn h2,http/1.1
    # velocityllm.pem = fullchain + private key concatenated

    # Security headers
    http-response set-header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
    http-response set-header X-Frame-Options "DENY"
    http-response set-header X-Content-Type-Options "nosniff"

    # Add real IP header
    option forwardfor

    # ── ACLs for routing decisions ──
    acl is_api      path_beg /api/
    acl is_health   path_beg /health
    acl is_stream   path_beg /api/v1/completions/stream
    acl is_ws       hdr(Upgrade) -i websocket
    acl is_auth     path_beg /api/v1/auth/login /api/v1/auth/register

    # ── Rate limiting via stick-tables ──
    # Track connections per IP
    stick-table type ip size 200k expire 5m store conn_cur,conn_rate(10s),http_req_rate(60s)
    http-request track-sc0 src
    # Reject if over 200 req/min (per IP)
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 200 }
    # Auth endpoints: max 10 req/min
    http-request deny deny_status 429 if is_auth { sc_http_req_rate(0) gt 10 }

    # ── Route to backends ──
    use_backend streaming_backend if is_stream
    use_backend websocket_backend if is_ws
    use_backend api_backend        if is_api
    default_backend frontend_backend

# =============================================================================
# API backend — weighted round-robin with cookie-based sticky sessions
# =============================================================================
backend api_backend
    balance leastconn                 # least connections (best for LLM workloads)

    # Cookie-based sticky sessions — HAProxy inserts "SERVERID" cookie
    cookie VLMSERVER insert indirect nocache httponly

    # Passive health checks
    option httpchk GET /health/ready
    http-check expect status 200
    default-server inter 10s fall 3 rise 2 maxconn 500

    # Backends: server <name> <host>:<port> weight <1-256> check cookie <cookie-value>
    server api-node-1 127.0.0.1:8080 weight 100 check cookie node1
    server api-node-2 127.0.0.1:8081 weight 100 check cookie node2
    server api-node-3 127.0.0.1:8082 weight  50 check cookie node3   # canary

    # Response header — which backend served this request
    http-response set-header X-Served-By %[srv_name]

# =============================================================================
# Streaming backend — no buffering, long timeouts
# =============================================================================
backend streaming_backend
    balance roundrobin
    option httpchk GET /health/live
    http-check expect status 200
    timeout server 300s
    timeout tunnel 3600s

    # Don't buffer SSE responses
    option http-server-close
    default-server inter 10s fall 3 rise 2

    server stream-node-1 127.0.0.1:8080 weight 100 check
    server stream-node-2 127.0.0.1:8081 weight 100 check

# =============================================================================
# WebSocket backend — upgrade + tunnel mode
# =============================================================================
backend websocket_backend
    balance source                    # ip_hash equivalent — sticky by source IP
    option httpchk GET /health/live
    http-check expect status 200
    timeout tunnel 3600s

    default-server inter 15s fall 2 rise 2

    server ws-node-1 127.0.0.1:8080 weight 100 check
    server ws-node-2 127.0.0.1:8081 weight 100 check

# =============================================================================
# Frontend (Next.js) backend
# =============================================================================
backend frontend_backend
    balance roundrobin
    option httpchk GET /
    http-check expect status 200

    default-server inter 10s fall 3 rise 2

    server frontend-1 127.0.0.1:3000 weight 100 check
