# =============================================================================
# VelocityLLM — Nginx Load Balancer Configuration (Day 33)
# =============================================================================
# Handles: SSL termination, weighted routing, sticky sessions, health checks,
#          rate limiting, gzip, and HTTP/2.
#
# Usage:
#   docker run -v $(pwd)/nginx.conf:/etc/nginx/nginx.conf nginx:alpine
#   or: nginx -c /path/to/this/nginx.conf
# =============================================================================

user  nginx;
worker_processes  auto;           # one worker per CPU core
worker_rlimit_nofile 65535;       # max open files per worker

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    use epoll;                    # Linux best practice
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    # -------------------------------------------------------------------------
    # Logging
    # -------------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time ub=$upstream_addr '
                    'us=$upstream_status ut=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    # -------------------------------------------------------------------------
    # Performance
    # -------------------------------------------------------------------------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    server_tokens   off;          # hide Nginx version

    gzip on;
    gzip_comp_level 4;
    gzip_types application/json text/plain application/javascript;
    gzip_min_length 1024;

    # -------------------------------------------------------------------------
    # Rate limiting zones (stored in shared memory)
    # -------------------------------------------------------------------------
    # 10 MB zone = ~160,000 IPs
    limit_req_zone  $binary_remote_addr zone=api_limit:10m rate=100r/m;
    limit_req_zone  $binary_remote_addr zone=auth_limit:1m  rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # -------------------------------------------------------------------------
    # Upstream pool — VelocityLLM backend instances
    # -------------------------------------------------------------------------
    # Algorithm: least_conn (fewest active connections).
    # Switch to: ip_hash for pure sticky sessions at the LB level,
    #            round-robin (default) for equal distribution.
    upstream velocityllm_pool {
        least_conn;                     # request routing algorithm

        # Each backend: server <host>:<port> weight=<1-100> max_fails=<n> fail_timeout=<s>;
        server 127.0.0.1:8080 weight=100 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:8081 weight=100 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:8082 weight=50  max_fails=3 fail_timeout=10s;  # canary / lower weight

        # Sticky session via cookie (requires nginx-plus or nginx sticky module).
        # With open-source Nginx, use ip_hash or handle affinity in the app layer.
        # sticky cookie vlm_affinity expires=1h httponly;

        # Passive health check: mark backend down after max_fails failures.
        # Active health checks require nginx-plus:
        # health_check interval=10s fails=3 passes=2 uri=/health/live;

        keepalive 32;                   # keep persistent connections to backends
    }

    # Upstream for the Next.js frontend (if serving both from the same LB)
    upstream frontend_pool {
        server 127.0.0.1:3000 weight=100;
        keepalive 16;
    }

    # -------------------------------------------------------------------------
    # HTTP → HTTPS redirect
    # -------------------------------------------------------------------------
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # -------------------------------------------------------------------------
    # HTTPS — SSL termination + load balancing
    # -------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        server_name velocityllm.example.com;   # ← change to your domain

        # --- SSL ---
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;   # from Let's Encrypt / cert authority
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # HSTS — tell browsers to always use HTTPS
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";

        # --- Connection limits ---
        limit_conn conn_limit 50;      # max 50 concurrent connections per IP

        # ── Load balancer health check (for the LB's own /health endpoint) ──
        location = /health {
            proxy_pass http://velocityllm_pool;
            proxy_connect_timeout 2s;
            proxy_read_timeout    5s;
            access_log off;
        }

        location = /health/live {
            proxy_pass http://velocityllm_pool;
            access_log off;
        }

        location = /health/ready {
            proxy_pass http://velocityllm_pool;
            access_log off;
        }

        # ── Auth endpoints — tighter rate limit ──
        location ~ ^/api/v1/auth/(login|register) {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://velocityllm_pool;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        # ── API endpoints ──
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass http://velocityllm_pool;
            include /etc/nginx/conf.d/proxy_params.conf;

            # Timeouts for long-running LLM completions
            proxy_connect_timeout  10s;
            proxy_send_timeout     120s;
            proxy_read_timeout     120s;

            # Pass real client IP to backend
            proxy_set_header X-Real-IP        $remote_addr;
            proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Streaming / SSE endpoints — disable buffering ──
        location ~ ^/api/v1/completions/stream {
            proxy_pass http://velocityllm_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;           # essential for SSE / streaming
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── WebSocket upgrade ──
        location /ws/ {
            proxy_pass http://velocityllm_pool;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;
            proxy_read_timeout 3600s;   # 1 hour for long-lived WS connections
        }

        # ── Frontend (Next.js) ──
        location / {
            proxy_pass http://frontend_pool;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        # ── Status page (internal only) ──
        location = /nginx_status {
            stub_status;
            allow 127.0.0.1;
            deny all;
        }
    }
}
