<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>body{margin:0;background:var(--surface-base);font-family:var(--font-sans);}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Alert, Toast, Dialog, Button, Icon } = window.VelocityLLMDesignSystem_359391;
function App() {
  const [open, setOpen] = React.useState(false);
  return (
    <div style={{padding:20, display:'flex', flexDirection:'column', gap:14}}>
      <Alert icon={<Icon name="zap" size={18} color="var(--color-primary)"/>} title="No requests yet.">
        Send prompts via the Playground to populate this dashboard.
      </Alert>
      <Alert variant="destructive" icon={<Icon name="alert-circle" size={18}/>} title="Failed to fetch data.">
        Make sure the backend is running.
      </Alert>
      <div style={{display:'flex', gap:10, flexWrap:'wrap'}}>
        <Toast variant="success">API key created successfully.</Toast>
        <Toast variant="error">Failed to save changes.</Toast>
      </div>
      <div>
        <Button onClick={() => setOpen(true)}>Open dialog</Button>
      </div>
      <Dialog open={open} onClose={() => setOpen(false)} title="Delete API key?" description="This action cannot be undone."
        footer={<><Button variant="outline" onClick={() => setOpen(false)}>Cancel</Button><Button variant="destructive">Delete</Button></>}>
        <p style={{color:'var(--text-secondary)', fontSize:14, margin:0}}>Requests using this key will be rejected immediately.</p>
      </Dialog>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
