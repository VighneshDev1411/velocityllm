<!-- @dsCard group="Components" viewport="700x480" name="Data Display" subtitle="Card, Badge, StatCard, StatusChip, Skeleton, Progress" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  body{margin:0;background:var(--surface-base);font-family:var(--font-sans);}
  @keyframes ds-skeleton-pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Card, CardHeader, CardTitle, CardDescription, CardContent, Badge, StatCard, StatusChip, Skeleton, Progress, Icon } = window.VelocityLLMDesignSystem_359391;
function App() {
  return (
    <div style={{padding:20, display:'flex', flexDirection:'column', gap:16}}>
      <div style={{display:'grid', gridTemplateColumns:'repeat(4, 1fr)', gap:12}}>
        <StatCard icon={<Icon name="activity" size={18}/>} label="Requests" value="12.4K" subtext="4.2 req/s" color="blue" />
        <StatCard icon={<Icon name="dollar-sign" size={18}/>} label="Cost" value="$18.20" subtext="Avg $0.0021/req" color="green" />
        <StatCard icon={<Icon name="clock" size={18}/>} label="Latency" value="184ms" subtext="P99: 640ms" color="purple" />
        <StatCard icon={<Icon name="alert-circle" size={18}/>} label="Errors" value="0.4%" subtext="12 total" color="orange" />
      </div>
      <div style={{display:'flex', gap:10, flexWrap:'wrap', alignItems:'center'}}>
        <Badge>Default</Badge>
        <Badge variant="secondary">Secondary</Badge>
        <Badge variant="destructive">Destructive</Badge>
        <Badge variant="outline">Outline</Badge>
        <StatusChip label="Healthy" status="success" />
        <StatusChip label="Degraded" status="warning" />
        <StatusChip label="Critical" status="error" />
        <StatusChip label="Busy" status="info" />
        <StatusChip label="Idle" status="default" />
      </div>
      <Card style={{maxWidth:420}}>
        <CardHeader>
          <CardTitle>API Keys</CardTitle>
          <CardDescription>Manage keys used to authenticate requests.</CardDescription>
        </CardHeader>
        <CardContent>
          <Progress value={62} />
        </CardContent>
      </Card>
      <div style={{display:'flex', gap:12}}>
        <Skeleton style={{width:160, height:20}} />
        <Skeleton style={{width:80, height:20}} />
        <Skeleton style={{width:220, height:20}} />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
