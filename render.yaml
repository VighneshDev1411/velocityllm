databases:
  - name: velocityllm-db
    databaseName: velocityllm
    user: velocityllm
    plan: free

services:
  # 1. Go Backend API
  - type: web
    name: velocityllm-backend
    runtime: go
    buildCommand: go build -o server cmd/server/main.go
    startCommand: ./server
    healthCheckPath: /health
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: velocityllm-db
          property: connectionString
      - key: DB_HOST
        fromDatabase:
          name: velocityllm-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: velocityllm-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: velocityllm-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: velocityllm-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: velocityllm-db
          property: database
      - key: JWT_SECRET
        generateValue: true

  # 2. Next.js Frontend
  - type: web
    name: velocityllm-frontend
    runtime: node
    repo: https://github.com/VighneshDev1411/velocityllm
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://velocityllm-backend.onrender.com
